name: JANO safe release gate

on:
  pull_request:
    paths:
      - "jano-safe/**"
      - ".github/workflows/jano-safe-release.yml"
  push:
    branches: [jano-safe-release-intake-v1]
    paths:
      - "jano-safe/**"
      - ".github/workflows/jano-safe-release.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct exact content-addressed release
        working-directory: jano-safe/release
        run: |
          python reconstruct_release.py
          echo "8874c0115da9bb14351022503560e968895597aeff4e4f2155e6d4f230522e3e  jano-v1.0.1-experimental.tar.gz" | sha256sum -c -
          echo "b33c81fbdc9e68e95dca72e5064c506b6e6188bed9ca5aabbd0224d6b7bd427c  jano-v1.0.1-experimental.manifest.json" | sha256sum -c -

      - name: Bootstrap exact hash-pinned source
        run: |
          mkdir -p /tmp/jano-bootstrap
          tar -xzf jano-safe/release/jano-v1.0.1-experimental.tar.gz -C /tmp/jano-bootstrap
          test "$(tar -tzf jano-safe/release/jano-v1.0.1-experimental.tar.gz | grep -c '/MANIFEST.json$')" = 1

      - name: Compile and run full suite
        working-directory: /tmp/jano-bootstrap/jano-v1.0.1-experimental
        run: |
          python -m compileall -q src scripts tests
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run unchanged JANO work-graph canary
        working-directory: /tmp/jano-bootstrap/jano-v1.0.1-experimental
        run: |
          PYTHONPATH=src python -m jano.cli audit \
            --snapshot tests/fixtures/live_canary.json \
            --as-of 2026-08-14T01:46:00Z \
            --stale-hours 6 \
            --output /tmp/jano-live-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/jano-live-receipt.json').read_text())
          assert receipt['summary']['verdict_counts'] == {
              'MATAR': 4, 'CAMBIAR': 4, 'MOVER': 1,
              'FUSIONAR': 0, 'CREAR': 0, 'SIN_CAMBIO': 2,
          }
          assert receipt['summary']['mutations_performed'] == 0
          PY

      - name: Verify and safely extract exact release
        working-directory: /tmp/jano-bootstrap/jano-v1.0.1-experimental
        run: |
          PYTHONPATH=src python -m jano.cli verify-release \
            --archive "$GITHUB_WORKSPACE/jano-safe/release/jano-v1.0.1-experimental.tar.gz" \
            --manifest "$GITHUB_WORKSPACE/jano-safe/release/jano-v1.0.1-experimental.manifest.json" \
            --output /tmp/release-verification.json
          PYTHONPATH=src python -m jano.cli extract-release \
            --archive "$GITHUB_WORKSPACE/jano-safe/release/jano-v1.0.1-experimental.tar.gz" \
            --manifest "$GITHUB_WORKSPACE/jano-safe/release/jano-v1.0.1-experimental.manifest.json" \
            --destination /tmp/jano-safe-extracted \
            --output /tmp/release-extraction.json

      - name: Prove safe-extracted self-rebuild identity
        run: |
          python /tmp/jano-safe-extracted/jano-v1.0.1-experimental/scripts/build_release.py \
            --root /tmp/jano-safe-extracted/jano-v1.0.1-experimental \
            --out-dir /tmp/jano-rebuild
          cmp jano-safe/release/jano-v1.0.1-experimental.tar.gz /tmp/jano-rebuild/jano-v1.0.1-experimental.tar.gz
          cmp jano-safe/release/jano-v1.0.1-experimental.manifest.json /tmp/jano-rebuild/jano-v1.0.1-experimental.manifest.json
