name: Playwright Human Handoff

on:
  push:
    branches: [playwright-controller]
    paths:
      - '.github/workflows/playwright-human-handoff.yml'
      - 'playwright-handoff/**'
      - 'test/handoff.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-human-handoff
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controller
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install visible-browser bridge
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb x11vnc x11-utils novnc websockify
          curl -fsSL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install Playwright CDP dependency
        working-directory: playwright-handoff
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run handoff unit tests
        run: node --test test/handoff.test.mjs

      - name: Start isolated visible Chrome session
        id: session
        run: bash playwright-handoff/start-session.sh playwright-handoff/request.json

      - name: Upload short-lived access record
        uses: actions/upload-artifact@v4
        with:
          name: playwright-handoff-access-${{ github.run_id }}
          path: playwright-handoff/session-access/access.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove local access record after upload
        run: |
          shred -u playwright-handoff/session-access/access.json || rm -f playwright-handoff/session-access/access.json

      - name: Wait for human verification and resume through CDP
        id: monitor
        continue-on-error: true
        run: node playwright-handoff/monitor.mjs playwright-handoff/request.json

      - name: Upload deterministic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-handoff-evidence-${{ github.run_id }}
          path: playwright-handoff/artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-handoff-diagnostics-${{ github.run_id }}
          path: |
            /tmp/xvfb.log
            /tmp/chrome.log
            /tmp/x11vnc.log
            /tmp/websockify.log
            /tmp/cloudflared.log
            /tmp/cloudflared.stdout
          if-no-files-found: warn
          retention-days: 2

      - name: Stop ephemeral browser and tunnel
        if: always()
        run: |
          for pidfile in /tmp/cloudflared.pid /tmp/websockify.pid /tmp/x11vnc.pid /tmp/chrome.pid /tmp/xvfb.pid; do
            if [[ -f "$pidfile" ]]; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done
          rm -rf /tmp/playwright-human-profile /tmp/vnc.pass playwright-handoff/session-access

      - name: Enforce handoff result
        if: steps.monitor.outcome != 'success'
        run: exit 1
