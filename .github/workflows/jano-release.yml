name: JANO release gate

on:
  push:
    branches: [jano-reconsideration-v1]
    paths:
      - "jano/**"
      - ".github/workflows/jano-release.yml"
  pull_request:
    paths:
      - "jano/**"
      - ".github/workflows/jano-release.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify committed release
        working-directory: jano/release
        run: |
          python reconstruct_release.py
          echo "2f5442434e5913b03b40bac85a1e76d6ff0da44b8770e1a4381e7faad00e6cc7  jano-v1.0.0-experimental.tar.gz" | sha256sum -c -
          echo "05c0033fb2abb8a9be0f96f7bfdc9e632c094c0b19e650311d00b7480f8b3e34  jano-v1.0.0-experimental.manifest.json" | sha256sum -c -
          echo "002fda9c4d90d98eca5305d3ea6b327f929bd570e58463dbe12af70f06a94189  jano-live-canary-receipt.json" | sha256sum -c -
      - name: Extract exact release
        run: |
          mkdir -p /tmp/jano
          tar -xzf jano/release/jano-v1.0.0-experimental.tar.gz -C /tmp/jano
      - name: Compile and test
        working-directory: /tmp/jano/jano-v1.0.0-experimental
        run: |
          python -m compileall -q src scripts tests
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run live canary fixture
        working-directory: /tmp/jano/jano-v1.0.0-experimental
        run: |
          PYTHONPATH=src python -m jano.cli audit \
            --snapshot tests/fixtures/live_canary.json \
            --as-of 2026-08-14T01:46:00Z \
            --stale-hours 6 \
            --output /tmp/jano-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/jano-receipt.json').read_text())
          expected = {"MATAR":4,"CAMBIAR":4,"MOVER":1,"FUSIONAR":0,"CREAR":0,"SIN_CAMBIO":2}
          assert receipt["summary"]["verdict_counts"] == expected
          assert receipt["summary"]["mutations_performed"] == 0
          assert all(not decision["mutation_performed"] for decision in receipt["decisions"])
          PY
      - name: Check canonical planner boundary
        working-directory: /tmp/jano/jano-v1.0.0-experimental
        run: |
          grep -R "record_work_relevance_decisions_v2" README.md docs/MANUAL.md docs/SKILL.md
          grep -R "no es una traducción automática" README.md docs/MANUAL.md docs/SKILL.md
      - name: Prove self-rebuild identity and one manifest
        working-directory: /tmp/jano/jano-v1.0.0-experimental
        run: |
          python scripts/build_release.py --root . --out-dir /tmp/rebuild
          cmp /tmp/rebuild/jano-v1.0.0-experimental.tar.gz "$GITHUB_WORKSPACE/jano/release/jano-v1.0.0-experimental.tar.gz"
          cmp /tmp/rebuild/jano-v1.0.0-experimental.manifest.json "$GITHUB_WORKSPACE/jano/release/jano-v1.0.0-experimental.manifest.json"
          test "$(tar -tzf "$GITHUB_WORKSPACE/jano/release/jano-v1.0.0-experimental.tar.gz" | grep -c '/MANIFEST.json$')" = 1
